[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "steerwx"
version = "0.2.0"
description = "A lightweight WeChat companion for ChatGPT and Codex on your PC."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SteerWX contributors"}]
dependencies = [
  "keyring>=25.0",
  "playwright>=1.48",
  "qrcode>=8.0",
  "requests>=2.32",
]

[project.scripts]
steerwx = "steerwx.cli:main"
clawbridge = "steerwx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steerwx", "src/clawbridge"]
